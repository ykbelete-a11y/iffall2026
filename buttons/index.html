<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Styling — Yared Belete</title>
<link href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Cormorant+Garamond:wght@600&family=Fredoka:wght@600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main>

<h1>Button Styling — Yared Belete</h1>

<div class="button_container">
<a href="http://www.spotify.com" target="_blank" id="btn_spotify">Spotify</a>
</div>

<div class="button_container">
<a href="http://www.amazon.com" target="_blank" id="btn_amazon"><i class="fa fa-amazon"></i></a>
</div>

<div class="button_container">
<a href="http://www.twitter.com" target="_blank" id="btn_twitter">twitter</a>
</div>

<div class="button_container">
<a href="http://www.indiegogo.com" target="_blank" id="btn_indiegogo"><span>indiegogo</span></a>
</div>

<div class="button_container">
<a href="http://www.nike.com/us/en_us/" target="_blank" id="btn_nike"><span>Just Do It</span></a>
</div>

<div class="button_container">
<a href="http://www.missouribotanicalgarden.org/" target="_blank" id="btn_mobot"><i class="fa fa-leaf"></i>Visit the Garden</a>
</div>

<div class="button_container">
<a href="http://thecolorrun.com/" target="_blank" id="btn_colorrun">Get Colorful</a>
</div>

<div class="button_container">
<a href="http://www.explodingkittens.com/" target="_blank" id="btn_kittens"><i class="fa fa-bomb"></i>Play Now</a>
</div>

<div class="button_container">
<a href="http://www.newyorker.com/" target="_blank" id="btn_newyorker">The New Yorker</a>
</div>

</main>

</body>
</html>
